[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-output-tracer"
version = "0.13.1"
description = "Universal AI agent session forensic debugger. Replay, trace, and query agent behavior when output looks wrong."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "agent-output-tracer contributors" },
]
requires-python = ">=3.11"
keywords = [
    "agent-debugging",
    "session-forensic",
    "ai-observability",
    "claude-code",
    "codex",
    "trace",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]
tui = [
    "textual>=0.50",
    "watchdog>=3.0",
]

[project.scripts]
agent-output-tracer = "cli.main:main"
aot = "cli.main:main"

[project.urls]
Homepage = "https://github.com/itosdad/agent-output-tracer"
Documentation = "https://github.com/itosdad/agent-output-tracer/tree/main/docs"
Source = "https://github.com/itosdad/agent-output-tracer"
Issues = "https://github.com/itosdad/agent-output-tracer/issues"
Changelog = "https://github.com/itosdad/agent-output-tracer/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = [
    "adapters",
    "core",
    "query",
    "analyzer",
    "cli",
    "tui",
    "tui.screens",
    "tui.themes",
    "tui.widgets",
    "bridges",
]

[tool.setuptools.package-data]
tui = ["themes/*.tcss"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
# Hook scripts must run under whatever python3 the user has on PATH (incl.
# the 3.9 macOS system Python). The recorder pipeline (hooks → adapters → core)
# is loaded in that process, so this directory tree is held to 3.9 compatibility:
# disable pyupgrade rules that would emit 3.10+/3.11+ syntax suggestions.
"hooks/*" = ["UP006", "UP007", "UP017", "UP035", "UP045"]
"adapters/*" = ["UP006", "UP007", "UP017", "UP035", "UP045"]
"core/*" = ["UP006", "UP007", "UP017", "UP035", "UP045"]
